# Publishes this n8n community node package to npm on every version tag push.
#
# ─── ONE-TIME SETUP ────────────────────────────────────────────────────────────
#
# OIDC Trusted Publishing (no long-lived secrets):
#   1. Log in to npmjs.com and open your package's settings.
#   2. Under "Publish access" → "Trusted Publishers", click "Add a publisher".
#   3. Select GitHub Actions and fill in:
#        Repository owner: Siopy
#        Repository name:  n8n-nodes-opencti
#        Workflow name:    publish.yml
#        Environment:      (leave blank)

name: Publish

on:
  push:
    tags:
      - '*.*.*'

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Release
        run: npm run release
